name: PCB Release

on:
  push:
    branches:
      - main
    paths:
      - pcb/*/VERSION

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.changed.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect changed models
        id: changed
        run: |
          # Find VERSION files that changed in this push
          changed=$(git diff --name-only HEAD~1 HEAD | grep '^pcb/.*/VERSION$' || true)

          models=()
          for f in $changed; do
            model=$(echo "$f" | cut -d'/' -f2)
            models+=("$model")
          done

          if [ ${#models[@]} -eq 0 ]; then
            echo "matrix={\"include\":[]}" >> $GITHUB_OUTPUT
          else
            json=$(printf '{"model":"%s"},' "${models[@]}")
            json="[${json%,}]"
            echo "matrix={\"include\":$json}" >> $GITHUB_OUTPUT
          fi

  release:
    needs: detect
    if: ${{ fromJson(needs.detect.outputs.matrix).include[0] != null }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      matrix: ${{ fromJson(needs.detect.outputs.matrix) }}

    steps:
      - uses: actions/checkout@v4

      - name: Read version
        id: version
        run: |
          VERSION=$(cat "pcb/${{ matrix.model }}/VERSION" | tr -d '[:space:]')
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Check tag does not already exist
        id: check_tag
        run: |
          TAG="pcb-${{ matrix.model }}-v${{ steps.version.outputs.version }}"
          if git ls-remote --tags origin "refs/tags/$TAG" | grep -q .; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Package model PCB files
        if: steps.check_tag.outputs.exists == 'false'
        run: |
          MODEL="${{ matrix.model }}"
          VERSION="${{ steps.version.outputs.version }}"
          zip -r "soundspy-pcb-${MODEL}-v${VERSION}.zip" "pcb/${MODEL}/"
          echo "pcb_zip=soundspy-pcb-${MODEL}-v${VERSION}.zip" >> $GITHUB_ENV

      - name: Create release
        if: steps.check_tag.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          MODEL="${{ matrix.model }}"
          VERSION="${{ steps.version.outputs.version }}"
          TAG="pcb-${MODEL}-v${VERSION}"
          git tag "$TAG"
          git push origin "$TAG"
          gh release create "$TAG" \
            --title "PCB: ${MODEL} v${VERSION}" \
            --notes "PCB files for the **${MODEL}** mic carrier board, version ${VERSION}." \
            "${{ env.pcb_zip }}"
