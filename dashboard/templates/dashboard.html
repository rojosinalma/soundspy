                            <button class="audio-control" id="sleep-btn-${nodeId}" onclick="toggleSleep('${nodeId}')" title="Sleep / Wake">☾ Sleep</button>
                            <button class="audio-control" onclick="disconnectNode('${nodeId}')" title="Disconnect Node">✕ Disconnect</button>
                        </div>
                    `;
                    grid.appendChild(card);

                    // Initialize knob controls for new cards
                    initMicGainKnob(nodeId);
                    initVolumeKnob(nodeId);

                    // Initialize EQ mode
                    eqModes[nodeId] = 'bars';

                    // Set initial positions after DOM is ready
                    setTimeout(() => {
                        updateMicGain(nodeId, 40);  // Set initial mic gain to 40% (4x)
                        updateBrowserVolume(nodeId, 50);  // Set initial volume to 50%
                        initThresholdControls(nodeId);  // Initialize threshold controls
                    }, 0);
                }

                // Update display name if changed
                const nameEl = document.getElementById(`node-display-name-${nodeId}`);
                if (nameEl && nodeDisplayNames[nodeId] && nameEl.contentEditable !== 'true') {
                    nameEl.textContent = nodeDisplayNames[nodeId];
                }

                // Update status
                const isOnline = data.online;
                const isSleeping = data.sleeping;
                const statusDot = card.querySelector('.status-dot');
                const statusText = card.querySelector('.status-text');

                if (isSleeping) {
                    card.classList.remove('offline');
                    statusDot.classList.remove('offline');
                    statusText.textContent = 'Sleeping';
                    sleepingNodes.add(nodeId);
                    const btn = document.getElementById(`sleep-btn-${nodeId}`);
                    if (btn) btn.textContent = '☀ Wake';
                } else if (isOnline) {
                    card.classList.remove('offline');
                    statusDot.classList.remove('offline');
                    statusText.textContent = 'Online';
                    sleepingNodes.delete(nodeId);
                    const btn = document.getElementById(`sleep-btn-${nodeId}`);
                    if (btn) btn.textContent = '☾ Sleep';
                } else {
                    card.classList.add('offline');
                    statusDot.classList.add('offline');
                    statusText.textContent = 'Offline';
                }

                // Update firmware version and IP
                if (data.firmware_version) {
                    const fwElem = document.getElementById(`fw-version-${nodeId}`);
                    if (fwElem) {
                        fwElem.textContent = `v${data.firmware_version}`;
                    }
                }
                if (data.current.ip) {
                    const ipElem = document.getElementById(`node-ip-${nodeId}`);
                    if (ipElem) {
                        ipElem.textContent = data.current.ip;
                    }
                }

                // Cache A-weight offset and refresh threshold display when bands first arrive
                if (data.current.bands && !card.dataset.bandsReady) {
                    card.dataset.bandsReady = '1';
                    computeAndCacheAWeightOffset(nodeId, data.current.bands);
                    refreshThresholdDisplay(nodeId);
                }

                // Drop level and spectrum to floor when offline/sleeping
                if (!isOnline || isSleeping) {
                    card.querySelector('.overall-value').textContent = '-80';
                    drawLevelMeter(nodeId, -80);
                    drawEQ(nodeId, [-80, -80, -80, -80, -80, -80]);
                    card.classList.remove('alert');
                    emaLevels[nodeId] = -80;
                } else if (data.current.overall_dbfs !== null) {
                    // Compute level (use A-weighted sum of bands if dBA mode)
                    let rawLevel = data.current.overall_dbfs;
                    if (useAWeighting && data.current.bands) {
                        rawLevel = computeWeightedOverall(data.current.bands);
                    }
                    rawLevels[nodeId] = Math.max(-80, rawLevel);
                    const smoothed = getSmoothedLevel(nodeId, rawLevel);
                    const displayDbfs = Math.max(-80, smoothed);
                    card.querySelector('.overall-value').textContent = Math.round(displayDbfs);
                    // Peak tracks smoothed level; bar follows raw
                    drawLevelMeter(nodeId, displayDbfs, rawLevels[nodeId]);

                    // Update EQ visualization
                    if (data.current.bands) {
                        const weightedBands = applyAWeighting(data.current.bands);
                        const bandOrder = ['sub_bass', 'bass', 'low_mid', 'mid', 'high_mid', 'high'];
                        const bandValues = bandOrder.map(name => Math.max(-80, weightedBands[name] || -80));

                        drawEQ(nodeId, bandValues);

                        // Check smoothed level against threshold (both in display unit)
                        if (displayDbfs > thresholdInDisplayUnit(nodeId)) {
                            card.classList.add('alert');
                        } else {
                            card.classList.remove('alert');
                        }
                    }
                }

            });
        }

        // Node color palette (supports many nodes)
        const nodeColors = [
            '#44dd66', '#06b6d4', '#84cc16', '#14b8a6',
            '#eab308', '#33bb55', '#2dd4bf', '#a3e635'
        ];
        let nodeColorMap = {};
        let nodeColorIndex = 0;
        function getNodeColor(nodeId) {
            if (!nodeColorMap[nodeId]) {
                nodeColorMap[nodeId] = nodeColors[nodeColorIndex % nodeColors.length];
                nodeColorIndex++;
            }
            return nodeColorMap[nodeId];
        }

        function getZoneColor(dbfs) {
            const t = thresholdInDisplayUnit(historySelectedNode !== 'all' ? historySelectedNode : null);
            if (dbfs >= t) return '#ef4444';
            if (dbfs >= t - 10) return '#f59e0b';
            return '#22c55e';
        }

        // Update chart with historical data
        async function updateChart() {
            updateHistoryNodeSelector();
            const datasets = [];
            const allNodeData = [];

            const nodesToShow = historySelectedNode === 'all'
                ? Object.keys(nodesData)
                : [historySelectedNode].filter(id => nodesData[id]);

            for (const nodeId of nodesToShow) {
                try {
                    const response = await fetch(`/api/history/${nodeId}`);
                    const data = await response.json();

                    if (data.history && data.history.length > 1) {
                        let filteredHistory = data.history;
                        const newestTs = data.history[data.history.length - 1].timestamp;
                        const windowSecs = currentTimeRange === 'realtime' ? 30 : currentTimeRange;
                        const cutoff = newestTs - windowSecs;
                        filteredHistory = data.history.filter(point => point.timestamp >= cutoff);

                        if (filteredHistory.length < 2) continue;

                        const oldestTs = filteredHistory[0].timestamp;
                        const spanTs = filteredHistory[filteredHistory.length - 1].timestamp - oldestTs;

                        const overallData = filteredHistory.map(point => {
                            let level = point.overall_dbfs;
                            if (useAWeighting && point.bands) {
                                level = computeWeightedOverall(point.bands);
                            }
                            return {
                                x: spanTs > 0 ? (point.timestamp - oldestTs) / spanTs : 0,
                                y: Math.max(-80, level)
                            };
                        });

                        allNodeData.push(filteredHistory.map(point => {
                            let level = point.overall_dbfs;
                            if (useAWeighting && point.bands) {
                                level = computeWeightedOverall(point.bands);
                            }
                            return { ts: point.timestamp, y: Math.max(-80, level) };
                        }));

                        datasets.push({
                            label: nodeId,
                            data: overallData,
                            borderColor: getNodeColor(nodeId),
                            backgroundColor: 'transparent',
                            borderWidth: 2,
                            pointRadius: 0,
                            tension: 0.2
                        });
                    }
                } catch (error) {
                    console.error(`Failed to fetch history for ${nodeId}:`, error);
                }
            }

            // Compute average line across all nodes
            // Compute average across all visible data points as a flat horizontal line
            if (allNodeData.length >= 1) {
                const allValues = allNodeData.flatMap(nd => nd.map(p => p.y));
                if (allValues.length > 0) {
                    const avg = allValues.reduce((a, b) => a + b, 0) / allValues.length;
                    const avgLevel = Math.max(-80, avg);

                    datasets.push({
                        label: `Avg: ${avgLevel.toFixed(1)} ${useAWeighting ? 'dBA' : 'dBFS'}`,
                        stableKey: 'avg',
                        data: [{x: 0, y: avgLevel}, {x: 1, y: avgLevel}],
                        borderColor: getZoneColor(avgLevel),
                        backgroundColor: 'transparent',
                        borderWidth: 2.5,
                        borderDash: [6, 4],
                        pointRadius: 0,
                        tension: 0,
                        order: -1
                    });
                }
            }

            // Preserve hidden state from legend toggles (use stableKey for avg since label changes)
            const hiddenState = {};
            historyChart.data.datasets.forEach((ds, i) => {
                const meta = historyChart.getDatasetMeta(i);
                const key = ds.stableKey || ds.label;
                if (meta.hidden) hiddenState[key] = true;
            });

            historyChart.options.scales.x.min = 0;
            historyChart.options.scales.x.max = 1;
            historyChart.data.datasets = datasets;

            datasets.forEach((ds, i) => {
                const key = ds.stableKey || ds.label;
                if (hiddenState[key]) {
                    historyChart.getDatasetMeta(i).hidden = true;
                }
            });

            historyChart.update();
        }

        // Fetch current state
        async function fetchNodes() {
            try {
                const response = await fetch('/api/nodes');
                const data = await response.json();

                nodesData = data.nodes;
                thresholdValue = data.threshold;

                // Pre-populate display names so selectors show names immediately on load
                Object.entries(data.nodes).forEach(([nodeId, node]) => {
                    if (node.display_name) nodeDisplayNames[nodeId] = node.display_name;
                });

                updateNodeCards(data.nodes);
            } catch (error) {
                console.error('Failed to fetch nodes:', error);
            }
        }

        // Chart update interval control
        let chartUpdateInterval;
        let currentTimeRange = 'realtime';

        function startChartUpdates() {
            if (chartUpdateInterval) clearInterval(chartUpdateInterval);
            const interval = currentTimeRange === 'realtime' ? 500 : 2000;
            chartUpdateInterval = setInterval(updateChart, interval);
        }

        // Initialize
        initChart();
        fetchNodes().then(() => updateChart());
        startChartUpdates();

        // Log panel state
        let logAutoScroll = true;
        let logScrolledByCode = false;
        let logSelectedNode = 'all';
        let logSelectedTab = 'app';
        const logStore = {};  // { nodeId: { app: [entries], system: [entries] } }
        const logKnownNodes = new Set();

        document.getElementById('logContent').addEventListener('scroll', function() {
            if (logScrolledByCode) return;
            const el = this;
            const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 30;
            if (!atBottom) {
                logAutoScroll = false;
                document.getElementById('logResumeBtn').style.display = 'block';
            }
        });

        function ensureLogNode(nodeId) {
            if (!logKnownNodes.has(nodeId)) {
                logKnownNodes.add(nodeId);
                if (!logStore[nodeId]) logStore[nodeId] = { app: [], system: [] };
                const sidebar = document.getElementById('logSidebar');
                const item = document.createElement('div');
                item.className = 'log-sidebar-item';
                item.dataset.node = nodeId;
                item.textContent = nodeDisplayNames[nodeId] || nodeId;
                item.onclick = () => selectLogNode(nodeId);
                sidebar.appendChild(item);
            }
        }

        function selectLogNode(nodeId) {
            logSelectedNode = nodeId;
            document.querySelectorAll('.log-sidebar-item').forEach(el => {
                el.classList.toggle('active', el.dataset.node === nodeId);
            });
            renderLog();
        }

        function selectLogTab(tab) {
            logSelectedTab = tab;
            document.querySelectorAll('.log-tab').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tab);
            });
            renderLog();
        }

        function renderLog() {
            const logContent = document.getElementById('logContent');
            logContent.innerHTML = '';

            let entries = [];
            if (logSelectedNode === 'all') {
                Object.keys(logStore).forEach(nid => {
                    entries = entries.concat(logStore[nid][logSelectedTab] || []);
                });
                entries.sort((a, b) => a.ts - b.ts);
            } else {
                entries = (logStore[logSelectedNode] && logStore[logSelectedNode][logSelectedTab]) || [];
            }

            const visible = entries.slice(-MAX_LOG_ENTRIES);
            if (visible.length === 0) {
                logContent.innerHTML = '<div style="color: #666; text-align: center; padding: 20px;">No logs yet.</div>';
                return;
            }

            visible.forEach(e => logContent.appendChild(e.el.cloneNode(true)));
            logScrolledByCode = true;
            logContent.scrollTop = logContent.scrollHeight;
            logScrolledByCode = false;
        }

        function addAppLogEntry(nodeId, data, timestamp) {
            ensureLogNode(nodeId);
            const now = new Date(timestamp * 1000);
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false });

            const entry = document.createElement('div');
            entry.className = 'log-entry';

            let bandsStr = '';
            if (data.bands) {
                bandsStr = Object.entries(data.bands)
                    .map(([name, value]) => `${name}=${value.toFixed(1)}`)
                    .join(', ');
            }
            const seqStr = data.seq !== undefined ? `#${data.seq}` : '';

            entry.innerHTML = `
                <span class="log-timestamp">[${timeStr}]</span>
                <span class="log-node">${nodeId}</span>
                <span class="log-seq">${seqStr}</span>
                <span class="log-data">overall=${data.overall_dbfs?.toFixed(1) || '--'} dBFS | ${bandsStr}</span>
            `;

            logStore[nodeId].app.push({ ts: timestamp, el: entry });
            if (logStore[nodeId].app.length > MAX_LOG_ENTRIES) logStore[nodeId].app.shift();

            if (logSelectedTab === 'app' && (logSelectedNode === 'all' || logSelectedNode === nodeId)) {
                appendToVisibleLog(entry);
            }
        }

        function addSystemLogEntry(nodeId, payload, timestamp) {
            ensureLogNode(nodeId);
            const now = new Date(timestamp * 1000);
            const timeStr = now.toLocaleTimeString('en-US', { hour12: false });
            const level = payload.level || 'info';
            const msg = payload.msg || JSON.stringify(payload);

            const entry = document.createElement('div');
            entry.className = `log-entry level-${level}`;
            entry.innerHTML = `
                <span class="log-timestamp">[${timeStr}]</span>
                <span class="log-node">${nodeId}</span>
                <span class="log-level ${level}">${level}</span>
                <span class="log-data">${msg}</span>
            `;

            logStore[nodeId].system.push({ ts: timestamp, el: entry });
            if (logStore[nodeId].system.length > MAX_LOG_ENTRIES) logStore[nodeId].system.shift();

            if (logSelectedTab === 'system' && (logSelectedNode === 'all' || logSelectedNode === nodeId)) {
                appendToVisibleLog(entry);
            }
        }

        function appendToVisibleLog(entry) {
            const logContent = document.getElementById('logContent');
            if (logContent.children.length === 1 && logContent.children[0].textContent.includes('Waiting')) {
                logContent.innerHTML = '';
            }
            if (logContent.children.length === 1 && logContent.children[0].textContent.includes('No logs')) {
                logContent.innerHTML = '';
            }
            logContent.appendChild(entry.cloneNode(true));

            if (logAutoScroll) {
                while (logContent.children.length > MAX_LOG_ENTRIES) {
                    logContent.removeChild(logContent.firstChild);
                }
                logScrolledByCode = true;
                logContent.scrollTop = logContent.scrollHeight;
                logScrolledByCode = false;
            }
        }

        function resumeLogScroll() {
            logAutoScroll = true;
            renderLog();
            document.getElementById('logResumeBtn').style.display = 'none';
        }

        function clearLog() {
            if (logSelectedNode === 'all') {
                Object.keys(logStore).forEach(nid => { logStore[nid][logSelectedTab] = []; });
            } else if (logStore[logSelectedNode]) {
                logStore[logSelectedNode][logSelectedTab] = [];
            }
            renderLog();
            logAutoScroll = true;
            document.getElementById('logResumeBtn').style.display = 'none';
        }

        function toggleLog() {
            const logBody = document.getElementById('logBody');
            const logArrow = document.getElementById('logArrow');

            if (logBody.style.display === 'none') {
                logBody.style.display = 'flex';
                logArrow.textContent = '−';
                renderLog();
                resizeLog();
            } else {
                logBody.style.display = 'none';
                logArrow.textContent = '+';
            }
        }

        function resizeLog() {
            const logBody = document.getElementById('logBody');
            if (logBody.style.display === 'none') return;
            const footer = document.querySelector('.footer');
            const footerTop = footer.getBoundingClientRect().top;
            const logBodyTop = logBody.getBoundingClientRect().top;
            const gap = 32;
            const available = footerTop - logBodyTop - gap;
            logBody.style.height = Math.max(200, available) + 'px';
        }

        window.addEventListener('resize', resizeLog);

        function setTimeRange(range) {
            currentTimeRange = range;

            // Update button states
            document.querySelectorAll('.time-range-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');

            // Restart chart update interval with appropriate frequency
            startChartUpdates();

            // Reload chart with new range
            updateChart();
        }

        // WebSocket for real-time updates (replaces SSE for lower latency)
        socket.on('sensor_data', function(update) {
            if (!nodesData[update.node_id]) {
                nodesData[update.node_id] = {
                    online: true,
                    last_update: null,
                    current: {}
                };
            }

            if (update.display_name) {
                nodeDisplayNames[update.node_id] = update.display_name;
            }

            nodesData[update.node_id].current = update.data;
            nodesData[update.node_id].last_update = update.timestamp;
            nodesData[update.node_id].online = true;
            if (update.firmware_version) {
                nodesData[update.node_id].firmware_version = update.firmware_version;
            }
            updateNodeCards(nodesData);
            addAppLogEntry(update.node_id, update.data, update.timestamp);
        });

        socket.on('node_log', function(update) {
            addSystemLogEntry(update.node_id, update.payload, update.timestamp);
        });
        let confirmResolve = null;
        function showConfirm(title, message) {
            document.getElementById('confirm-title').textContent = title;
            document.getElementById('confirm-message').textContent = message;
            document.getElementById('confirmModal').style.display = 'flex';
            return new Promise(resolve => { confirmResolve = resolve; });
        }
        function closeConfirmModal(result) {
            document.getElementById('confirmModal').style.display = 'none';
            if (confirmResolve) { confirmResolve(result); confirmResolve = null; }
        }

        async function rebootNode(nodeId) {
            if (!await showConfirm('Reboot Node', `Reboot ${nodeId}?`)) return;
            fetch('/api/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({node_id: nodeId, command: {reboot: true}})
            }).then(() => {
                nodesData[nodeId].online = false;
                updateNodeCards(nodesData);
            }).catch(err => console.error('Reboot failed:', err));
        }

        async function toggleSleep(nodeId) {
            const isSleeping = sleepingNodes.has(nodeId);
            if (!isSleeping) {
                if (!await showConfirm('Sleep', `Put ${nodeId} to sleep? You can wake it from the dashboard.`)) return;
            }
            const command = isSleeping ? {wake: true} : {sleep: true};
            fetch('/api/control', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({node_id: nodeId, command})
            }).then(() => {
                if (isSleeping) {
                    sleepingNodes.delete(nodeId);
                } else {
                    sleepingNodes.add(nodeId);
                }
                const btn = document.getElementById(`sleep-btn-${nodeId}`);
                if (btn) btn.textContent = sleepingNodes.has(nodeId) ? '☀ Wake' : '☾ Sleep';
            }).catch(err => console.error('Sleep/wake failed:', err));
        }

        async function disconnectNode(nodeId) {
            if (!await showConfirm('Disconnect Node', `Disconnect ${nodeId}? It will disappear from the dashboard.`)) return;
            fetch('/api/disconnect', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({node_id: nodeId})
            }).then(() => {
                delete nodesData[nodeId];
                updateNodeCards(nodesData);
            }).catch(err => console.error('Disconnect failed:', err));
        }

        function renameNode(nodeId) {
            const el = document.getElementById(`node-display-name-${nodeId}`);
            if (!el || el.contentEditable === 'true') return;
            const current = el.textContent;
            el.contentEditable = 'true';
            el.style.outline = '1px solid #f59e0b';
            el.style.padding = '0 4px';
            el.style.borderRadius = '3px';
            el.focus();
            const range = document.createRange();
            range.selectNodeContents(el);
            window.getSelection().removeAllRanges();
            window.getSelection().addRange(range);

            const commit = () => {
                el.contentEditable = 'false';
                el.style.outline = '';
                el.style.padding = '';
                const newName = el.textContent.trim();
                if (!newName || newName === current) {
                    el.textContent = current;
                    return;
                }
                fetch('/api/node/rename', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({chip_id: nodeId, name: newName})
                }).then(res => res.json()).then(data => {
                    if (data.success) {
                        nodeDisplayNames[nodeId] = newName;
                    } else {
                        el.textContent = current;
                    }
                }).catch(() => { el.textContent = current; });
            };

            el.addEventListener('blur', commit, {once: true});
            const onKey = (e) => {
                if (e.key === 'Enter') { e.preventDefault(); el.blur(); }
                if (e.key === 'Escape') { el.textContent = current; el.blur(); }
            };
            el.addEventListener('keydown', onKey);
            el.addEventListener('blur', () => el.removeEventListener('keydown', onKey), {once: true});
        }

        // OTA Update functions
        let otaSelectedFile = null;
        let otaTargetNode = null;

        function showOTADialog(nodeId) {
            otaTargetNode = nodeId;
            otaSelectedFile = null;

            document.getElementById('ota-node-name').textContent = nodeId;

            const versionElem = document.getElementById(`fw-version-${nodeId}`);
            const currentVersion = versionElem ? versionElem.textContent : 'Unknown';
            document.getElementById('ota-current-version').textContent = currentVersion;

            document.getElementById('ota-file-name').textContent = '';
            document.getElementById('ota-progress').textContent = '';
            document.getElementById('ota-upload-btn').disabled = true;
            document.getElementById('ota-file-input').value = '';

            document.getElementById('otaModal').classList.add('active');
        }

        function closeOTAModal() {
            document.getElementById('otaModal').classList.remove('active');
            otaSelectedFile = null;
            otaTargetNode = null;
        }

        document.getElementById('ota-file-input').addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (file) {
                otaSelectedFile = file;
                document.getElementById('ota-file-name').textContent = `Selected: ${file.name} (${(file.size / 1024).toFixed(1)} KB)`;
                document.getElementById('ota-upload-btn').disabled = false;
            }
        });

        async function performOTAUpload() {
            if (!otaSelectedFile || !otaTargetNode) return;

            const uploadBtn = document.getElementById('ota-upload-btn');
            const progressElem = document.getElementById('ota-progress');

            uploadBtn.disabled = true;
            progressElem.textContent = 'Uploading firmware...';

            try {
                // Upload firmware
                const formData = new FormData();
                formData.append('firmware', otaSelectedFile);

                const uploadResp = await fetch('/api/ota/upload', {
                    method: 'POST',
                    body: formData
                });

                const uploadData = await uploadResp.json();
                if (!uploadData.success) {
                    progressElem.textContent = `Upload failed: ${uploadData.error}`;
                    uploadBtn.disabled = false;
                    return;
                }

                progressElem.textContent = 'Triggering OTA update...';

                // Trigger OTA update
                const triggerResp = await fetch('/api/ota/trigger', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        node_id: otaTargetNode,
                        firmware_url: uploadData.url
                    })
                });

                const triggerData = await triggerResp.json();
                if (triggerData.success) {
                    progressElem.textContent = 'OTA update started! Node will reboot in ~30 seconds.';
                    setTimeout(closeOTAModal, 3000);
                } else {
                    progressElem.textContent = `OTA trigger failed: ${triggerData.error}`;
                    uploadBtn.disabled = false;
                }
            } catch (err) {
                progressElem.textContent = `Error: ${err.message}`;
                uploadBtn.disabled = false;
            }
        }

    </script>
</body>
