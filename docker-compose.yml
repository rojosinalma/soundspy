services:
  soundspy-mosquitto:
    image: eclipse-mosquitto:2
    container_name: soundspy_mosquitto
    restart: unless-stopped
    ports:
      - "${MQTT_PORT}:1883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
      - ./mosquitto/log:/mosquitto/log

  soundspy-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dashboard
    container_name: soundspy_dashboard
    restart: unless-stopped
    depends_on:
      - soundspy-mosquitto
    environment:
      - MQTT_HOST=soundspy-mosquitto
      - MQTT_PORT=1883
    ports:
      - "${DASHBOARD_PORT}:8091"
    volumes:
      - ./builds:/app/firmware
      - ./data:/app/data
      - ./dashboard/app.py:/app/app.py
      - ./dashboard/db.py:/app/db.py
      - ./dashboard/node_state.py:/app/node_state.py
      - ./dashboard/notifications.py:/app/notifications.py
      - ./dashboard/helpers.py:/app/helpers.py
      - ./dashboard/templates:/app/templates

