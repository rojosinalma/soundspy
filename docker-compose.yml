services:
  soundspy-dashboard:
    build:
      context: ./dashboard
      dockerfile: Dockerfile.dashboard
    container_name: soundspy_dashboard
    restart: unless-stopped
    environment:
      - MQTT_HOST=${MQTT_HOST}
      - MQTT_PORT=${MQTT_PORT}
      - MQTT_USER=${MQTT_USER}
      - MQTT_PASS=${MQTT_PASS}
    ports:
      - "${DASHBOARD_PORT}:8091"
    volumes:
      - ./builds:/app/firmware
      - ./data:/app/data
      - ./dashboard/app.py:/app/app.py
      - ./dashboard/db.py:/app/db.py
      - ./dashboard/node_state.py:/app/node_state.py
      - ./dashboard/notifications.py:/app/notifications.py
      - ./dashboard/helpers.py:/app/helpers.py
      - ./dashboard/templates:/app/templates
